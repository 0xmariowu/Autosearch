name: Nightly — Live Integration Tests

on:
  # Daily schedule removed: live tests hit ~14 real public endpoints from a
  # shared CI IP, so transient upstream rate-limits/blocks (429/403/5xx)
  # produced a false-alarm failure email nearly every night with no actionable
  # signal. Run on demand from the Actions tab instead, where a human can read
  # the result. The job still fails loudly on any real regression.
  workflow_dispatch:       # manual trigger only

permissions:
  contents: read

jobs:
  live-channels:
    name: Free Channel Live Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" --quiet

      - name: Run live channel integration tests
        run: |
          pytest tests/integration/test_free_channels_live.py \
            -m "live and not flaky_live" \
            -v \
            --timeout=60 \
            --ignore=tests/perf \
            -x

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-live-test-results
          path: .pytest_cache/
          retention-days: 7
